<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #1e1f26;
    color: #f2f2f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    gap: 16px;
  }
  h1 { margin: 0; letter-spacing: 1px; }
  #status { font-size: 1.2rem; min-height: 1.5em; }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 8px;
    background: #2b2d3a;
    padding: 8px;
    border-radius: 12px;
  }
  .cell {
    background: #33354a;
    border: none;
    border-radius: 8px;
    font-size: 2.5rem;
    font-weight: bold;
    color: #f2f2f2;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .cell:hover:not(:disabled) { background: #40435c; }
  .cell:disabled { cursor: default; }
  .cell.x { color: #5fb4ff; }
  .cell.o { color: #ff7a7a; }
  .cell.win { background: #3f6b3f; }
  #controls { display: flex; gap: 12px; }
  button#reset, #modeSelect {
    padding: 8px 16px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #4c50e0;
    color: white;
    cursor: pointer;
  }
  button#reset:hover { background: #5c60ff; }
  #modeSelect { background: #33354a; }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="controls">
    <select id="modeSelect">
      <option value="pvp">2 Players</option>
      <option value="cpu">vs Computer</option>
    </select>
    <button id="reset">New Game</button>
  </div>
  <div id="status">X's turn</div>
  <div id="board"></div>

<script>
(function () {
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');
  const modeSelect = document.getElementById('modeSelect');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let current = 'X';
  let gameOver = false;
  let cells = [];

  function makeBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (let i = 0; i < 9; i++) {
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.dataset.index = i;
      btn.addEventListener('click', onCellClick);
      boardEl.appendChild(btn);
      cells.push(btn);
    }
  }

  function onCellClick(e) {
    const idx = Number(e.currentTarget.dataset.index);
    if (gameOver || board[idx]) return;
    play(idx);
  }

  function play(idx) {
    board[idx] = current;
    render();
    const result = checkWinner();
    if (result) {
      endGame(result);
      return;
    }
    if (board.every(c => c)) {
      statusEl.textContent = "It's a draw!";
      gameOver = true;
      return;
    }
    current = current === 'X' ? 'O' : 'X';
    statusEl.textContent = `${current}'s turn`;

    if (!gameOver && modeSelect.value === 'cpu' && current === 'O') {
      setTimeout(cpuMove, 300);
    }
  }

  function cpuMove() {
    if (gameOver) return;
    const idx = bestMove();
    if (idx !== -1) play(idx);
  }

  function bestMove() {
    // Try to win
    for (const line of WIN_LINES) {
      const idx = winningMoveInLine(line, 'O');
      if (idx !== -1) return idx;
    }
    // Block opponent
    for (const line of WIN_LINES) {
      const idx = winningMoveInLine(line, 'X');
      if (idx !== -1) return idx;
    }
    // Take center
    if (!board[4]) return 4;
    // Take a corner
    const corners = [0,2,6,8].filter(i => !board[i]);
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    // Take any open
    const open = board.map((v,i) => v ? -1 : i).filter(i => i !== -1);
    return open.length ? open[Math.floor(Math.random() * open.length)] : -1;
  }

  function winningMoveInLine(line, player) {
    const vals = line.map(i => board[i]);
    const playerCount = vals.filter(v => v === player).length;
    const emptyIdx = line.filter(i => !board[i]);
    if (playerCount === 2 && emptyIdx.length === 1) return emptyIdx[0];
    return -1;
  }

  function checkWinner() {
    for (const line of WIN_LINES) {
      const [a,b,c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { winner: board[a], line };
      }
    }
    return null;
  }

  function endGame({ winner, line }) {
    gameOver = true;
    statusEl.textContent = `${winner} wins!`;
    line.forEach(i => cells[i].classList.add('win'));
  }

  function render() {
    board.forEach((v, i) => {
      cells[i].textContent = v || '';
      cells[i].classList.toggle('x', v === 'X');
      cells[i].classList.toggle('o', v === 'O');
      cells[i].disabled = !!v || gameOver;
    });
  }

  function newGame() {
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    makeBoard();
    render();
    statusEl.textContent = "X's turn";
  }

  resetBtn.addEventListener('click', newGame);
  modeSelect.addEventListener('change', newGame);

  newGame();
})();
</script>
</body>
</html>
